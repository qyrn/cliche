<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src capture:"
    />
    <title>cliché</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="masthead">
      <h1>cliché</h1>
      <p id="count"></p>
      <input
        type="search"
        id="search"
        data-i18n-placeholder="searchPlaceholder"
        data-i18n-aria-label="searchLabel"
        spellcheck="false"
        autocomplete="off"
      />
      <button type="button" id="open-folder" data-i18n="openFolder"></button>
    </header>
    <main id="sheet">
      <p id="empty" data-i18n="emptyHistory" hidden></p>
      <p id="no-match" hidden></p>
    </main>
    <footer>
      <p id="status" role="status" aria-live="polite" data-i18n="historyTip"></p>
    </footer>
    <template id="frame-template">
      <li class="frame">
        <button type="button" class="shot" draggable="true">
          <img alt="" loading="lazy" decoding="async" />
        </button>
        <div class="caption">
          <time></time>
          <span class="tools">
            <button type="button" data-tool="text" data-i18n="toolText"></button>
            <button type="button" data-tool="open" data-i18n="toolOpen"></button>
            <button type="button" data-tool="trash" data-i18n="toolTrash"></button>
          </span>
        </div>
      </li>
    </template>
  </body>
</html>
