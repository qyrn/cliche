<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src capture:"
    />
    <title>cliché</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <header class="masthead">
      <h1>cliché</h1>
      <p id="count"></p>
      <input
        type="search"
        id="search"
        placeholder="Chercher un mot dans tes captures"
        aria-label="Chercher dans le texte des captures"
        spellcheck="false"
        autocomplete="off"
      />
      <button type="button" id="open-folder">Ouvrir le dossier</button>
    </header>
    <main id="sheet">
      <p id="empty" hidden>Aucune capture pour l'instant. Appuie sur Impr pour faire la première !</p>
      <p id="no-match" hidden></p>
    </main>
    <footer>
      <p id="status" role="status" aria-live="polite">
        Clique sur une capture pour la copier, double-clique pour l'ouvrir, ou glisse-la dans une autre app.
      </p>
    </footer>
    <template id="frame-template">
      <li class="frame">
        <button type="button" class="shot" draggable="true">
          <img alt="" loading="lazy" decoding="async" />
        </button>
        <div class="caption">
          <time></time>
          <span class="tools">
            <button type="button" data-tool="text">Texte</button>
            <button type="button" data-tool="open">Ouvrir</button>
            <button type="button" data-tool="trash">Supprimer</button>
          </span>
        </div>
      </li>
    </template>
  </body>
</html>
