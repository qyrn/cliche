<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>cliché</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <canvas id="shade"></canvas>
    <output id="size" hidden></output>
    <div id="loupe" hidden>
      <canvas></canvas>
      <output></output>
    </div>
    <div id="actions" role="toolbar" aria-label="Que faire de cette zone" hidden>
      <button type="button" class="primary" data-action="copy">Copier <kbd>Entrée</kbd></button>
      <button type="button" data-action="text">Copier le texte <kbd>T</kbd></button>
      <button type="button" data-action="dismiss">Annuler <kbd>Échap</kbd></button>
    </div>
    <p id="hint">
      Glisse pour choisir une zone
      <span class="legend"><kbd>Entrée</kbd> tout l'écran</span>
      <span class="legend"><kbd>Échap</kbd> annuler</span>
    </p>
  </body>
</html>
