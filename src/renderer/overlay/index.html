<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <title>cliché</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <canvas id="shade"></canvas>
    <output id="size" hidden></output>
    <div id="loupe" hidden>
      <canvas></canvas>
      <output></output>
    </div>
    <div id="actions" role="toolbar" data-i18n-aria-label="overlayToolbarLabel" hidden>
      <button type="button" class="primary" data-action="copy">
        <span data-i18n="copy"></span> <kbd data-i18n="keyEnter"></kbd>
      </button>
      <button type="button" data-action="text"><span data-i18n="copyText"></span> <kbd>T</kbd></button>
      <button type="button" data-action="blur" aria-pressed="false">
        <span data-i18n="blur"></span> <kbd>B</kbd>
      </button>
      <button type="button" data-action="dismiss">
        <span data-i18n="cancel"></span> <kbd data-i18n="keyEscape"></kbd>
      </button>
    </div>
    <p id="blur-hint" class="hint" hidden>
      <span data-i18n="blurHint"></span>
      <span id="blur-status" class="status"></span>
      <span class="legend"><kbd>Ctrl+Z</kbd> <span data-i18n="removeLastBlur"></span></span>
      <span class="legend"><kbd>B</kbd> <span data-i18n="finishBlur"></span></span>
    </p>
    <p id="hint" class="hint">
      <span data-i18n="aimHint"></span>
      <span class="legend"><kbd data-i18n="keyEnter"></kbd> <span data-i18n="wholeScreen"></span></span>
      <span class="legend"><kbd data-i18n="keyEscape"></kbd> <span data-i18n="cancelHint"></span></span>
    </p>
  </body>
</html>
